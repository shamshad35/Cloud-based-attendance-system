<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Dashboard</title><link rel="stylesheet" href="/css/style.css"></head>
<body><nav><div><b>☁ Cloud Attendance</b><span class="role">Student Dashboard</span></div><a href="/logout">Logout</a></nav>
<main class="container"><div class="profile card"><div class="avatar" th:text="${#strings.substring(student.name,0,1)}"></div><div><h1 th:text="${student.name}"></h1><p th:text="${student.enrollmentNo+' • '+student.branch+' • Semester '+student.semester}"></p></div></div>
<h2>Attendance Summary</h2><div class="grid">
<div class="stat card" th:each="m:${summary}"><h3 th:text="${m.subject.name}"></h3><div class="big" th:text="${m.percentage+'%'}"></div><p th:text="${m.present+' / '+m.total+' classes attended'}"></p></div>
</div>
<h2>Attendance History</h2><div class="card"><table><thead><tr><th>Date</th><th>Subject</th><th>Status</th></tr></thead><tbody>
<tr th:each="r:${records}"><td th:text="${r.date}"></td><td th:text="${r.subject.name}"></td><td><span th:class="${r.present?'badge present':'badge absent'}" th:text="${r.present?'Present':'Absent'}"></span></td></tr>
<tr th:if="${#lists.isEmpty(records)}"><td colspan="3">No attendance records found.</td></tr>
</tbody></table></div>
</main></body></html>
